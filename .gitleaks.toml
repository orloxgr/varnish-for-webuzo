title = "Public source with narrowly scoped synthetic protocol fixtures"
[extend]
useDefault = true

[[allowlists]]
description = "Public upstream signing-key digest, never a private credential"
condition = "AND"
paths = ['''^src/repository\.py$''']
regexTarget = "match"
regexes = ['''KEY_SHA256\s*=\s*['"][a-f0-9]{64}['"]''']

[[allowlists]]
description = "Derived vectors for the explicitly synthetic fixture secret"
condition = "AND"
paths = ['''^tests/fixtures/private_(reuse_finalize(_producer)?|mutation_wire)_v1\.json$''']
regexTarget = "match"
regexes = ['''(?:reuseKeyHex|derivedKeyHex)":\s*"[a-f0-9]{64}"''']

[[allowlists]]
description = "Recognizable non-live Joomla test token sequences, including historical tests"
condition = "AND"
paths = ['''^tests/test_joomla_(forms|policy)\.py$''']
regexTarget = "match"
regexes = ['''TOKEN(?:_[AB])?\s*=\s*['"](?:0123456789abcdef0123456789abcdef|fedcba9876543210fedcba9876543210)['"]''']
