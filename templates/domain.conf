# Managed by Varnish for Webuzo. Included in the native server context.
set $wv_native_origin http://127.0.0.1:8081;
if ($scheme = https) { set $wv_native_origin https://127.0.0.1:8082; }

# Only public asset types; PHP and arbitrary files always reach the application.
location ~* ^/(?![.]well-known/|webmail(?:/|$)|wp-content/uploads/(?:woocommerce_uploads|wc-logs)(?:/|$))(?:[^/.][^/]*/)*[^/.][^/]*[.](?:@@ASSET_EXTENSIONS@@)$ {
    if ($host !~ "@@HOSTS@@") { return 418; }
    error_page 418 = @wv_native;
    error_page 419 = @wv_dynamic;
    @@STATIC_BYPASS@@
    disable_symlinks if_not_owner;
    error_page 404 = @wv_dynamic;
    @@BROWSER_CACHE@@
    add_header X-Webuzo-Varnish "STATIC" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ~ ^/(?![.]well-known(?:/|$)|webmail(?:/|$)|(?:404|497|500)[.]html$) {
    if ($host !~ "@@HOSTS@@") { return 418; }
    error_page 418 = @wv_native;
    error_page 502 503 504 = @wv_outage;
    @@VARNISH_PROXY@@
}
location @wv_dynamic {
    error_page 502 503 504 = @wv_outage;
    @@VARNISH_PROXY@@
}
location @wv_native {
    @@NATIVE_PROXY@@
}
location @wv_outage {
    # Do not replay writes that may already have reached the application.
    if ($request_method !~ ^(GET|HEAD)$) { return 503; }
    @@NATIVE_PROXY@@
    add_header X-Webuzo-Varnish "FALLBACK" always;
}
